name: Notify failed release

on:
  workflow_run:
    workflows:
      - Release
      - Development Release
      - Site Publish
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  notify_failure:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' && (github.event.workflow_run.name != 'Site Publish' || github.event.workflow_run.event != 'pull_request') }}
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: |
        title: ${{ github.event.workflow_run.name == 'Site Publish' && 'IsolaRail Site Publish deployment failure' || 'IsolaRail release workflow failure' }}
        project: ${{ github.repository }}
        status: failure
        result: ${{ github.event.workflow_run.conclusion }}
        target_sha: ${{ github.event.workflow_run.head_sha }}
        run_url: ${{ github.event.workflow_run.html_url }}
        workflow: ${{ github.event.workflow_run.name }}
        ref: ${{ github.event.workflow_run.head_branch && format('branch: {0}', github.event.workflow_run.head_branch) || 'ref: unavailable from workflow_run payload' }}
        attempt: ${{ github.event.workflow_run.run_attempt }}
        actor: ${{ github.event.workflow_run.actor.login || github.actor }}
        event: ${{ github.event.workflow_run.event }}
        note: ${{ github.event.workflow_run.name == 'Site Publish' && 'Site Publish deployment failed' || 'Release workflow failed' }}

  smoke_test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: |
        title: IsolaRail notifier smoke test
        project: ${{ github.repository }}
        status: smoke
        result: simulated-failure
        target_sha: ${{ github.sha }}
        run_url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        workflow: Notify failed release
        ref: ${{ format('branch: {0}', github.ref_name) }}
        attempt: ${{ github.run_attempt }}
        actor: ${{ github.actor }}
        event: workflow_dispatch
        note: manual notifier smoke test
